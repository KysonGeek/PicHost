<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PicHost · 私人图床</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <span>PicHost</span>
      </div>
      <nav>
        <a href="#upload-section" class="nav-link active">上传</a>
        <a href="#gallery-section" class="nav-link">画廊</a>
      </nav>
    </div>
  </header>

  <main class="main">
    <!-- Hero -->
    <section class="hero" id="upload-section">
      <h1 class="hero-title">私人图床</h1>
      <p class="hero-sub">支持拖拽 / 粘贴上传 · 多格式链接一键复制</p>

      <!-- Upload zone -->
      <div class="upload-card">
        <div class="upload-zone" id="uploadZone">
          <input type="file" id="fileInput" accept="image/*" multiple hidden />
          <div class="upload-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <p class="upload-hint-main">点击选择 或 拖拽图片到此处</p>
          <p class="upload-hint-sub">也可按 <kbd>Ctrl+V</kbd> 直接粘贴截图</p>
          <p class="upload-hint-sub">支持 JPG · PNG · GIF · WebP · BMP · SVG &nbsp;|&nbsp; 最大 20MB</p>
        </div>

        <!-- Progress -->
        <div class="progress-wrap" id="progressWrap" style="display:none">
          <div class="progress-bar" id="progressBar"></div>
          <span class="progress-text" id="progressText">0%</span>
        </div>
      </div>

      <!-- Results list -->
      <div id="resultsList"></div>
    </section>

    <!-- Gallery -->
    <section class="gallery-section" id="gallery-section">
      <div class="section-header">
        <h2 class="section-title">最近上传</h2>
        <span class="gallery-count" id="galleryCount"></span>
      </div>
      <div class="gallery-grid" id="galleryGrid">
        <div class="gallery-empty" id="galleryEmpty">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          <p>暂无图片，快来上传吧</p>
        </div>
      </div>
      <div class="load-more-wrap" id="loadMoreWrap" style="display:none">
        <button class="btn-load-more" id="loadMoreBtn">加载更多</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© 2025 PicHost</p>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" style="display:none">
    <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
    <div class="lightbox-content">
      <img class="lightbox-img" id="lightboxImg" src="" alt="" />
      <button class="lightbox-close" id="lightboxClose">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <div class="lightbox-links" id="lightboxLinks"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Login Modal -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-card">
      <div class="login-logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <span>PicHost</span>
      </div>
      <h2 class="login-title">请输入访问密钥</h2>
      <form class="login-form" id="loginForm" autocomplete="off">
        <div class="login-input-wrap">
          <input type="password" id="loginPassword" class="login-input"
                 placeholder="密钥" autocomplete="current-password" />
          <button type="button" class="login-toggle-pw" id="togglePw" tabindex="-1" title="显示/隐藏密码">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <button type="submit" class="btn-login" id="loginBtn">登录</button>
        <p class="login-error" id="loginError"></p>
      </form>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
